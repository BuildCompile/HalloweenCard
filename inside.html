<!DOCTYPE html>
<html>
    <head>
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link rel="stylesheet" href="style.css">
        <title>Inside of the Card</title>
        <link rel="icon" type="x-icon" href=pumpkinfavicon.png>
    </head>
    <body>
        <audio autoplay>
            <source src="websiteaudio.mp3" type="audio/mpeg">
        </audio>
        <div class="verticalformatting">
            <div class="cardformatting">
                <h1>TRICK OR TREAT!</h1>
                <p>Happy Halloween! We hope that this year's Halloween brings you very memorable memories.<br>Have Fun!</p>
                <img src="skeleton.gif" width=25%><br>
                <button class="buttonforconfetti" id="confettibutton">Start Confetti</button>
                <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
                <script>
                    const button = document.getElementById('confettibutton')
                    button.addEventListener('click', () => {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.6 }
            });
        });       
                </script>
            </div>
            <div class="cardformatting2">
                <h1>TOP FIVE HALLOWEEN CANDIES:</h1>
                <p>1. Sour Patch Kids<br>
                2. Snickers<br>
                3. Reese's Pieces<br>
                4. Twix<br>
                5. Starburst</p>
                <video width="320" height="180" controls>
                    <source src="video.mp4" type="video/mp4">
                </video><br>
                <button class="buttonformatting"><a href="index.html">Close the Card</a></button>
            </div>
        </div>
    </body>
</html>
